
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="개인 일정을 간편하게 기록하고 관리하는 월간 일정 페이지" />
  <title>나의 일정</title>
  <style>
    :root{--ink:#17233d;--muted:#71809a;--line:#e7ebf2;--paper:#fff;--bg:#f4f7fb;--navy:#17233d;--blue:#3568e8;--blue-soft:#eaf0ff;--mint:#25a98b;--orange:#ef8b3c;--red:#dc5b67;--shadow:0 18px 48px rgba(28,42,76,.10)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;min-width:320px} button,input,select,textarea{font:inherit} button{cursor:pointer}
    .app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.sidebar{background:var(--navy);color:#fff;padding:32px 22px;display:flex;flex-direction:column}.brand{font-size:22px;font-weight:800;letter-spacing:-.04em;display:flex;align-items:center;gap:10px}.brand-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(140deg,#77a2ff,#3568e8);display:grid;place-items:center}.nav{margin-top:42px;display:grid;gap:8px}.nav button{border:0;background:transparent;color:#aeb9cf;text-align:left;padding:12px 14px;border-radius:12px;font-weight:650}.nav button.active{background:#273655;color:#fff}.nav button span{margin-right:10px}.tip{margin-top:auto;padding:16px;background:#202f4d;border-radius:16px;color:#c9d2e4;font-size:13px;line-height:1.65}.tip strong{display:block;color:#fff;margin-bottom:3px}
    main{padding:38px clamp(24px,4vw,58px)}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:26px}.eyebrow{font-size:13px;color:var(--blue);font-weight:750;margin-bottom:7px}.topbar h1{margin:0;font-size:clamp(28px,3vw,40px);letter-spacing:-.055em;line-height:1.15}.today-label{color:var(--muted);font-size:15px;margin-top:7px}.primary{border:0;border-radius:13px;background:var(--blue);color:white;padding:13px 18px;font-weight:750;box-shadow:0 9px 20px rgba(53,104,232,.25)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:17px 18px}.stat small{color:var(--muted);font-size:13px}.stat b{display:block;font-size:24px;margin-top:5px;letter-spacing:-.03em}.stat.accent{background:var(--navy);color:#fff;border-color:var(--navy)}.stat.accent small{color:#bac5da}
    .workspace{display:grid;grid-template-columns:minmax(560px,1.55fr) minmax(300px,.8fr);gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 25px rgba(36,50,80,.04)}.calendar{padding:22px}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.month-nav{display:flex;align-items:center;gap:10px}.month-nav h2{font-size:21px;margin:0;min-width:150px;text-align:center}.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--ink)}.today-btn{border:1px solid #ccd6eb;background:#fff;border-radius:10px;padding:8px 13px;font-size:13px;font-weight:700;color:var(--blue)}
    .week,.days{display:grid;grid-template-columns:repeat(7,1fr)}.week div{text-align:center;color:#8b98ad;font-size:12px;font-weight:750;padding:8px}.week div:first-child{color:var(--red)}.days{border-top:1px solid var(--line);border-left:1px solid var(--line)}.day{min-height:92px;padding:9px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;text-align:left;position:relative;overflow:hidden}.day:hover{background:#f8faff}.day.other{color:#bdc5d2;background:#fbfcfe}.day.selected{box-shadow:inset 0 0 0 2px var(--blue);z-index:1}.day.today .num{background:var(--blue);color:#fff}.num{display:grid;place-items:center;width:25px;height:25px;border-radius:9px;font-size:12px;font-weight:750}.dots{display:flex;gap:4px;margin-top:9px}.dot{width:6px;height:6px;border-radius:50%}.mini{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:7px;color:#50607b}
    .agenda{padding:22px;display:flex;flex-direction:column;min-height:590px}.agenda-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:15px;border-bottom:1px solid var(--line)}.agenda-head h2{font-size:18px;margin:0}.agenda-head span{font-size:13px;color:var(--muted)}.filters{display:flex;gap:7px;margin:14px 0}.filter{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:20px;padding:7px 10px;font-size:12px}.filter.active{background:var(--ink);color:#fff;border-color:var(--ink)}.list{display:grid;gap:10px}.event{border:1px solid var(--line);border-radius:15px;padding:13px;display:grid;grid-template-columns:8px 1fr auto;gap:11px;align-items:start}.event-color{width:8px;height:36px;border-radius:8px}.event.done .event-title{text-decoration:line-through;color:#9aa5b6}.event-time{font-size:12px;color:var(--muted);margin-bottom:3px}.event-title{font-size:15px;font-weight:750}.event-note{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}.event-actions{display:flex;gap:3px}.event-actions button{border:0;background:transparent;color:#9aa5b6;padding:4px;font-size:14px}.empty{margin:auto;text-align:center;color:var(--muted);padding:55px 10px}.empty-icon{font-size:34px;margin-bottom:10px}.empty strong{display:block;color:var(--ink);margin-bottom:5px}
    dialog{border:0;border-radius:22px;padding:0;width:min(480px,calc(100% - 28px));box-shadow:var(--shadow)}dialog::backdrop{background:rgba(14,23,42,.48);backdrop-filter:blur(3px)}.modal{padding:26px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h2{margin:0;font-size:21px}.close{border:0;background:#f1f4f8;border-radius:9px;width:34px;height:34px}.form{display:grid;gap:14px}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #dce2ec;border-radius:11px;padding:11px 12px;color:var(--ink);background:#fff}.field textarea{resize:vertical;min-height:78px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:8px}.secondary{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 15px;font-weight:700}.danger{margin-right:auto;border:0;background:#fff0f1;color:#c74453;border-radius:11px;padding:10px 15px;font-weight:700}
    @media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{display:none}.workspace{grid-template-columns:1fr}.agenda{min-height:360px}.day{min-height:80px}main{padding:28px 20px}}
    @media(max-width:620px){main{padding:22px 12px}.topbar{align-items:center}.topbar h1{font-size:27px}.today-label{font-size:13px}.primary{padding:11px 13px}.stats{gap:8px}.stat{padding:13px}.stat b{font-size:20px}.calendar{padding:13px}.month-nav h2{font-size:18px;min-width:125px}.day{min-height:58px;padding:5px}.week div{padding:6px 2px}.mini{display:none}.agenda{padding:16px}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar"><div class="brand"><span class="brand-mark">✓</span> 나의 일정</div><nav class="nav"><button class="active"><span>▦</span>월간 일정</button><button id="navToday"><span>◷</span>오늘 할 일</button></nav><div class="tip"><strong>작은 계획이 큰 변화를 만듭니다.</strong>일정은 이 브라우저에 안전하게 저장됩니다.</div></aside>
  <main>
    <header class="topbar"><div><div class="eyebrow">MY PLANNER</div><h1>좋은 하루예요</h1><div class="today-label" id="todayText"></div></div><button class="primary" id="addBtn">＋ 일정 추가</button></header>
    <section class="stats"><div class="stat accent"><small>오늘 일정</small><b id="todayCount">0</b></div><div class="stat"><small>이번 달 일정</small><b id="monthCount">0</b></div><div class="stat"><small>완료한 일정</small><b id="doneCount">0</b></div></section>
    <section class="workspace">
      <div class="card calendar"><div class="calendar-head"><div class="month-nav"><button class="icon-btn" id="prev" aria-label="이전 달">‹</button><h2 id="monthTitle"></h2><button class="icon-btn" id="next" aria-label="다음 달">›</button></div><button class="today-btn" id="goToday">오늘</button></div><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="days" id="days"></div></div>
      <aside class="card agenda"><div class="agenda-head"><h2 id="selectedTitle"></h2><span id="selectedWeekday"></span></div><div class="filters"><button class="filter active" data-filter="all">전체</button><button class="filter" data-filter="work">업무</button><button class="filter" data-filter="personal">개인</button><button class="filter" data-filter="important">중요</button></div><div class="list" id="eventList"></div></aside>
    </section>
  </main>
</div>
<dialog id="eventDialog"><form class="modal" id="eventForm"><div class="modal-head"><h2 id="modalTitle">새 일정</h2><button type="button" class="close" id="closeBtn" aria-label="닫기">×</button></div><div class="form"><div class="field"><label for="title">일정 제목</label><input id="title" required maxlength="50" placeholder="무엇을 할 예정인가요?" /></div><div class="row"><div class="field"><label for="date">날짜</label><input id="date" type="date" required /></div><div class="field"><label for="time">시간</label><input id="time" type="time" /></div></div><div class="field"><label for="category">분류</label><select id="category"><option value="work">업무</option><option value="personal">개인</option><option value="important">중요</option></select></div><div class="field"><label for="note">메모</label><textarea id="note" maxlength="160" placeholder="장소나 준비할 내용을 적어두세요"></textarea></div><div class="modal-actions"><button type="button" class="danger" id="deleteBtn" hidden>삭제</button><button type="button" class="secondary" id="cancelBtn">취소</button><button type="submit" class="primary">저장</button></div></div></form></dialog>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const colors={work:'#3568e8',personal:'#25a98b',important:'#ef5f66'}, labels={work:'업무',personal:'개인',important:'중요'};
const pad=n=>String(n).padStart(2,'0'), key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let today=new Date(), view=new Date(today.getFullYear(),today.getMonth(),1), selected=key(today), filter='all', editing=null;
let events=JSON.parse(localStorage.getItem('myPlannerEvents')||'null')||[
 {id:crypto.randomUUID(),title:'이번 주 계획 정리',date:key(today),time:'09:30',category:'work',note:'우선순위 업무 확인',done:false},
 {id:crypto.randomUUID(),title:'저녁 산책',date:key(today),time:'19:00',category:'personal',note:'가볍게 30분',done:false}
];
function save(){localStorage.setItem('myPlannerEvents',JSON.stringify(events))}
function formatToday(){return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(today)}
function render(){renderCalendar();renderAgenda();renderStats()}
function renderCalendar(){
 $('#monthTitle').textContent=`${view.getFullYear()}년 ${view.getMonth()+1}월`; $('#days').innerHTML='';
 const start=new Date(view.getFullYear(),view.getMonth(),1-view.getDay());
 for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=key(d), dayEvents=events.filter(e=>e.date===k).sort((a,b)=>a.time.localeCompare(b.time));const b=document.createElement('button');b.className='day'+(d.getMonth()!==view.getMonth()?' other':'')+(k===selected?' selected':'')+(k===key(today)?' today':'');b.dataset.date=k;b.innerHTML=`<span class="num">${d.getDate()}</span><div class="dots">${dayEvents.slice(0,4).map(e=>`<i class="dot" style="background:${colors[e.category]}"></i>`).join('')}</div>${dayEvents[0]?`<div class="mini">${dayEvents[0].time||'종일'} ${escapeHtml(dayEvents[0].title)}</div>`:''}`;b.onclick=()=>{selected=k;render()};$('#days').appendChild(b)}
}
function renderAgenda(){const d=new Date(selected+'T12:00:00');$('#selectedTitle').textContent=`${d.getMonth()+1}월 ${d.getDate()}일`;$('#selectedWeekday').textContent=new Intl.DateTimeFormat('ko-KR',{weekday:'long'}).format(d);const list=events.filter(e=>e.date===selected&&(filter==='all'||e.category===filter)).sort((a,b)=>a.time.localeCompare(b.time));const root=$('#eventList');root.innerHTML='';if(!list.length){root.innerHTML='<div class="empty"><div class="empty-icon">☁</div><strong>등록된 일정이 없어요</strong>새 일정을 가볍게 추가해 보세요.</div>';return}list.forEach(e=>{const el=document.createElement('article');el.className='event'+(e.done?' done':'');el.innerHTML=`<i class="event-color" style="background:${colors[e.category]}"></i><div><div class="event-time">${e.time||'종일'} · ${labels[e.category]}</div><div class="event-title">${escapeHtml(e.title)}</div>${e.note?`<div class="event-note">${escapeHtml(e.note)}</div>`:''}</div><div class="event-actions"><button aria-label="완료 전환" data-done="${e.id}">${e.done?'↶':'✓'}</button><button aria-label="수정" data-edit="${e.id}">✎</button></div>`;root.appendChild(el)});$$('[data-done]').forEach(b=>b.onclick=()=>{const e=events.find(x=>x.id===b.dataset.done);e.done=!e.done;save();render()});$$('[data-edit]').forEach(b=>b.onclick=()=>openModal(events.find(x=>x.id===b.dataset.edit)))}
function renderStats(){const ym=key(view).slice(0,7);$('#todayCount').textContent=events.filter(e=>e.date===key(today)&&!e.done).length;$('#monthCount').textContent=events.filter(e=>e.date.startsWith(ym)).length;$('#doneCount').textContent=events.filter(e=>e.done).length}
function openModal(e=null){editing=e?.id||null;$('#modalTitle').textContent=e?'일정 수정':'새 일정';$('#title').value=e?.title||'';$('#date').value=e?.date||selected;$('#time').value=e?.time||'';$('#category').value=e?.category||'work';$('#note').value=e?.note||'';$('#deleteBtn').hidden=!e;$('#eventDialog').showModal();setTimeout(()=>$('#title').focus(),50)}
function closeModal(){$('#eventDialog').close();editing=null}
function escapeHtml(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}
$('#todayText').textContent=formatToday();$('#addBtn').onclick=()=>openModal();$('#closeBtn').onclick=$('#cancelBtn').onclick=closeModal;
$('#prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('#next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
function jumpToday(){view=new Date(today.getFullYear(),today.getMonth(),1);selected=key(today);render()}$('#goToday').onclick=jumpToday;$('#navToday').onclick=jumpToday;
$$('.filter').forEach(b=>b.onclick=()=>{$$('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;renderAgenda()});
$('#eventForm').onsubmit=e=>{e.preventDefault();const item={id:editing||crypto.randomUUID(),title:$('#title').value.trim(),date:$('#date').value,time:$('#time').value,category:$('#category').value,note:$('#note').value.trim(),done:editing?(events.find(x=>x.id===editing)?.done||false):false};if(editing)events=events.map(x=>x.id===editing?item:x);else events.push(item);selected=item.date;view=new Date(item.date+'T12:00:00');view=new Date(view.getFullYear(),view.getMonth(),1);save();closeModal();render()};
$('#deleteBtn').onclick=()=>{if(editing&&confirm('이 일정을 삭제할까요?')){events=events.filter(x=>x.id!==editing);save();closeModal();render()}};
$('#eventDialog').addEventListener('click',e=>{if(e.target===$('#eventDialog'))closeModal()});render();
</script>
</body>
</html>
